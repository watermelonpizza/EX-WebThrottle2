name: Playwright
on:
  push:
    branches: ['main', 'next-release']

  pull_request:
    branches: ['main', 'master']

  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      # The e2e tests run against the host emulator, built from the
      # CommandStation-EX submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm run build

      - run: pnpm exec playwright install --with-deps

      - run: pnpm run test:e2e
